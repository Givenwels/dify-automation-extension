<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1f2329; background: #f7f8fa; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #fff; border-bottom: 1px solid #e5e6eb; }
  header .title { font-weight: 600; font-size: 14px; }
  header button { border: none; background: none; cursor: pointer; font-size: 13px; color: #4e5969; padding: 2px 6px; border-radius: 4px; }
  header button:hover { background: #f2f3f5; }
  #difyBar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 12px; background: #fff; border-bottom: 1px solid #e5e6eb; font-size: 12px; color: #4e5969; }
  #difyBar .ok { color: #00874d; }
  #difyBar .base { word-break: break-all; }
  #detectBtn { border: 1px solid #d9dbde; background: #fff; border-radius: 5px; padding: 1px 8px; font-size: 12px; cursor: pointer; color: #4e5969; white-space: nowrap; }
  #detectBtn:hover { background: #f2f3f5; }
  #settings { display: none; padding: 10px 12px; background: #fff; border-bottom: 1px solid #e5e6eb; }
  #settings.open { display: block; }
  #settings label { display: block; margin-bottom: 8px; color: #4e5969; }
  #settings input, #settings textarea { width: 100%; margin-top: 2px; padding: 6px 8px; border: 1px solid #d9dbde; border-radius: 6px; font-size: 12px; font-family: inherit; }
  #settings textarea { resize: vertical; }
  #settings .hint { font-size: 11px; color: #86909c; margin: -4px 0 8px; }
  #saveBtn { width: 100%; padding: 7px; border: none; border-radius: 6px; background: #1c64f2; color: #fff; cursor: pointer; font-size: 13px; }
  #saveBtn:hover { background: #1554d1; }
  #fetchModels { float: right; border: 1px solid #d9dbde; background: #fff; border-radius: 5px; padding: 0 8px; font-size: 11px; cursor: pointer; color: #4e5969; }
  #fetchModels:hover { background: #f2f3f5; }
  .chips { display: flex; gap: 6px; margin-top: 4px; }
  .chip { border: 1px solid #1c64f2; background: #fff; border-radius: 12px; padding: 1px 10px; font-size: 11px; cursor: pointer; color: #1c64f2; }
  .chip:hover { background: #e8f0fe; }
  main { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: #1c64f2; color: #fff; margin-left: 32px; }
  .msg.assistant { background: #fff; border: 1px solid #e5e6eb; margin-right: 12px; }
  .msg.error { background: #fff1f0; border: 1px solid #ffa39e; color: #cf1322; margin-right: 12px; }
  .msg.result { background: #f0f9eb; border: 1px solid #93d3a2; color: #1f6b2e; margin-right: 12px; font-family: Consolas, monospace; font-size: 12px; }
  .tool { margin-bottom: 8px; margin-right: 12px; background: #f2f3f5; border-radius: 8px; overflow: hidden; }
  .tool-head { padding: 6px 10px; cursor: pointer; color: #4e5969; font-size: 12px; user-select: none; }
  .tool-head:hover { background: #e5e6eb; }
  .tool-body { display: none; padding: 0 10px 8px; font: 11px/1.5 Consolas, monospace; color: #4e5969; white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow-y: auto; }
  .tool-body.open { display: block; }
  .tool-res { padding: 4px 10px 8px; font-size: 12px; color: #4e5969; word-break: break-all; }
  .tool-res a { color: #1c64f2; }
  #status { padding: 0 12px 6px; font-size: 12px; color: #86909c; min-height: 18px; }
  footer { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; background: #fff; border-top: 1px solid #e5e6eb; }
#modeRow { display: flex; gap: 6px; }
.modeBtn { border: 1px solid #d9dbde; background: #fff; border-radius: 12px; padding: 2px 12px; font-size: 12px; cursor: pointer; color: #4e5969; }
.modeBtn.active { border-color: #1c64f2; background: #e8f0fe; color: #1c64f2; }
.inputRow { display: flex; gap: 8px; }
  #input { flex: 1; resize: none; height: 60px; padding: 8px; border: 1px solid #d9dbde; border-radius: 8px; font: 13px/1.5 inherit; outline: none; }
  #input:focus { border-color: #1c64f2; }
  #send { width: 64px; border: none; border-radius: 8px; background: #1c64f2; color: #fff; cursor: pointer; }
  #send:disabled { background: #94bfff; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <span class="title">Dify 自动化</span>
  <div>
    <button id="newChat">新对话</button>
    <button id="gear" title="设置">⚙</button>
  </div>
</header>
<div id="difyBar">
  <span id="difyStatus" class="base">Dify：检测中…</span>
  <button id="detectBtn">检测</button>
</div>
<section id="settings">
  <label>LLM API Base
    <input id="llmBase" placeholder="https://openrouter.ai/api/v1">
  </label>
  <label>LLM API Key（已内置，留空即用；粘贴可覆盖）
    <input id="llmKey" type="password" placeholder="•••••••• 已内置 OpenRouter Key">
  </label>
  <label>模型 <button type="button" id="fetchModels">拉取列表</button>
    <input id="model" list="modelList" placeholder="xiaomi/mimo-v2.5">
    <datalist id="modelList"></datalist>
    <div class="chips" id="presetChips"></div>
  </label>
  <div class="hint" id="modelHint">默认小米 MiMo-V2.5（已实测支持工具调用）；想换 Pro 就把模型改成 xiaomi/mimo-v2.5-pro</div>
  <label>快聊模型（聊天模式专用，非推理所以快；留空用上面的模型）
    <input id="fastModel" placeholder="deepseek/deepseek-chat-v3.1">
  </label>
  <label>自定义规则（追加到系统提示词，优先级最高）
    <textarea id="customPrompt" rows="4" placeholder="例：&#10;- 所有 LLM 回答用中文&#10;- 知识库检索固定用「商品知识库」&#10;- 生成的输出必须是 JSON 格式"></textarea>
  </label>
  <div class="hint">Dify 不用填：自动使用浏览器里已登录的 Dify 标签页（打开并登录 Dify 后点上方「检测」）</div>
  <button id="saveBtn">保存</button>
  <div class="hint" id="verLabel"></div>
</section>
<main id="chat"></main>
<div id="status"></div>
<footer>
  <div id="modeRow">
    <button class="modeBtn active" data-mode="work" title="全功能：会真正在 Dify 上创建/修改/测试工作流">🛠 干活</button>
    <button class="modeBtn" data-mode="chat" title="快速对话：关掉模型思考，梳理需求、聊方案，不执行操作">💬 快聊</button>
  </div>
  <div class="inputRow">
    <textarea id="input" placeholder="干活模式：描述你要的 AI 应用，自动在 Dify 上搭建并测试"></textarea>
    <button id="send">发送</button>
  </div>
</footer>
<script src="sidepanel.js"></script>
</body>
</html>
